<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Blue angular command logo</title>
  <desc id="desc">A neon blue angular mark forming opposing chevrons around a white greater-than sign on a black background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#050607"/>
      <stop offset="55%" stop-color="#010203"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="blueFill" x1="364" y1="256" x2="890" y2="963" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06A7FF"/>
      <stop offset="52%" stop-color="#029AFF"/>
      <stop offset="100%" stop-color="#0087F5"/>
    </linearGradient>

    <linearGradient id="whiteFill" x1="610" y1="610" x2="696" y2="708" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7E7E7"/>
    </linearGradient>

    <filter id="softBlueGlow" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feFlood flood-color="#009CFF" flood-opacity="0.32" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softWhiteShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#softBlueGlow)">
    <!-- Upper-left angular bracket -->
    <path fill="url(#blueFill)" d="
      M 655 256
      C 666 256 674 259 684 265
      L 729 293
      C 744 302 745 319 731 328
      L 479 493
      C 459 506 459 516 478 529
      L 574 592
      C 584 599 588 611 588 624
      L 588 671
      C 588 684 574 691 562 684
      L 391 576
      C 373 565 363 547 363 526
      L 363 468
      C 363 449 373 431 390 420
      L 626 265
      C 636 259 645 256 655 256
      Z"/>

    <!-- Lower-right angular bracket -->
    <path fill="url(#blueFill)" d="
      M 628 459
      C 618 459 611 467 611 478
      L 611 536
      C 611 554 620 570 637 581
      L 797 686
      C 813 697 813 714 797 725
      L 489 892
      C 480 897 479 911 489 918
      L 557 959
      C 570 967 586 966 599 956
      L 868 759
      C 890 743 899 721 897 694
      L 897 646
      C 896 624 885 606 867 594
      L 642 464
      C 637 461 633 459 628 459
      Z"/>
  </g>

  <path filter="url(#softWhiteShadow)" fill="url(#whiteFill)" d="
    M 623 610
    C 616 606 610 611 610 619
    L 610 635
    L 648 658
    L 610 683
    L 610 700
    C 610 708 617 712 624 708
    L 688 670
    C 697 665 697 654 688 649
    L 623 610
    Z"/>
</svg>
